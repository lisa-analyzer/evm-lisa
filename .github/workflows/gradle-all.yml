name: 'Gradle Build (non-master branch)'

on:
  push:
    branches-ignore:
      - 'master'

jobs:
  compile-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: 'Gradle: compile and run unit tests'
        run: ./gradlew test
